plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.shelterconnect'
version = '0.0.1-SNAPSHOT'
description = 'Shelter Connect API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Sample loading is a development tool and is not included in the server JAR.
sourceSets {
	sample
}

configurations {
	sampleImplementation.extendsFrom implementation
	sampleRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation sourceSets.sample.output
	sampleImplementation sourceSets.main.output
}

tasks.register('loadSampleData', JavaExec) {
	description = 'Adds fictional data to a local development database without overwriting existing rows.'
	group = 'application'
	classpath = sourceSets.sample.runtimeClasspath
	mainClass = 'org.shelterconnect.sample.SampleDataLoader'
	args layout.projectDirectory.file('sample-data/dataset.json').asFile.absolutePath
}

tasks.register('exportSupabaseBootstrap', JavaExec) {
	description = 'Exports a one-time SQL script for an empty Supabase development project; does not connect.'
	group = 'application'
	classpath = sourceSets.sample.runtimeClasspath
	mainClass = 'org.shelterconnect.sample.SupabaseBootstrapExporter'
	args layout.projectDirectory.file('src/main/resources/db/migration/V1__create_shelter_domain.sql').asFile.absolutePath,
		layout.projectDirectory.file('sample-data/dataset.json').asFile.absolutePath,
		layout.buildDirectory.file('supabase-bootstrap.sql').get().asFile.absolutePath
}

tasks.register('exportSupabaseUpgrade', JavaExec) {
	description = 'Exports a guarded one-time V1 to V3 SQL Editor upgrade; never connects.'
	group = 'application'
	classpath = sourceSets.sample.runtimeClasspath
	mainClass = 'org.shelterconnect.sample.SupabaseUpgradeExporter'
	args layout.projectDirectory.dir('src/main/resources/db/migration').asFile.absolutePath,
		layout.buildDirectory.file('supabase-v2-v3-upgrade.sql').get().asFile.absolutePath
}

// Explicit local check only. Never runs as part of build, test, or CI.
tasks.register('checkPhotoStorage', JavaExec) {
	description = 'Checks the configured private Storage using the production photo adapter; --args=--prepare creates the bucket/fixture if absent.'
	group = 'verification'
	classpath = sourceSets.sample.runtimeClasspath
	mainClass = 'org.shelterconnect.sample.PhotoStorageConnectionCheck'
}

// Opt-in live check. Uses temporary Auth users and restarts only its own local API process.
tasks.register('checkLoginStorage', JavaExec) {
	description = 'Checks real development login and persistence, then removes only this run\'s test data.'
	group = 'verification'
	dependsOn tasks.named('bootJar')
	classpath = sourceSets.sample.runtimeClasspath
	mainClass = 'org.shelterconnect.sample.LoginStorageCheck'
}

// Manual HTTPS check only. Never deploys or restarts the remote service.
tasks.register('checkDeployedStorage', JavaExec) {
	description = 'Checks login and personal records through an explicit development Render origin, then cleans its own test users.'
	group = 'verification'
	dependsOn tasks.named('bootJar')
	classpath = sourceSets.sample.runtimeClasspath
	mainClass = 'org.shelterconnect.sample.DeployedStorageCheck'
}

// Explicit paid development check; never depends on test/build/CI.
tasks.register('checkAiLive', JavaExec) {
	description = 'Checks real Luna replies using reviewed fictional records and temporary users.'
	group = 'verification'
	dependsOn tasks.named('bootJar')
	classpath = sourceSets.sample.runtimeClasspath
	mainClass = 'org.shelterconnect.sample.AiLiveCheck'
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'postgres' }
}

tasks.register('integrationTest', Test) {
	description = 'Applies and checks the schema against a disposable PostgreSQL database.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'postgres' }
	shouldRunAfter tasks.named('test')
}

tasks.named('bootJar') {
	archiveFileName = 'shelter-connect-api.jar'
}
