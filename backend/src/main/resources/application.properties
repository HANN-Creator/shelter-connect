spring.application.name=shelter-connect-api
app.auth.supabase-url=${SUPABASE_URL}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.shutdown=graceful

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Apply only after the target database has been explicitly selected.
spring.flyway.enabled=${DB_MIGRATE:false}
spring.flyway.schemas=shelter
spring.flyway.default-schema=shelter
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-migration-naming=true
spring.jpa.properties.hibernate.default_schema=shelter

management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# Explicitly enable after providing a server-side API key. No calls are made by default.
app.ai.enabled=${AI_ENABLED:false}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-5.6-luna}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}

# Server-only signing for private dog photos. Empty photo lists work without Storage enabled.
app.photos.enabled=${PHOTO_STORAGE_ENABLED:false}
app.photos.secret-key=${SUPABASE_SECRET_KEY:}
app.photos.bucket=${PHOTO_STORAGE_BUCKET:dog-photos}
app.photos.timeout-seconds=${PHOTO_STORAGE_TIMEOUT_SECONDS:5}

# Generating drafts, running the worker and accepting automatic imports are separate opt-ins.
app.assets.enabled=${ASSET_GENERATION_ENABLED:false}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
spring.servlet.multipart.file-size-threshold=0
app.ai.behavior-daily-limit=${BEHAVIOR_AI_DAILY_LIMIT:20}
app.assets.worker-enabled=${ASSET_WORKER_ENABLED:false}
app.assets.auto-import=${ASSET_AUTO_IMPORT_ENABLED:false}
app.assets.api-key=${PIXELLAB_API_KEY:}
app.assets.storage-secret=${SUPABASE_SECRET_KEY:}
app.assets.photo-bucket=${PHOTO_STORAGE_BUCKET:dog-photos}
app.assets.bucket=${ASSET_STORAGE_BUCKET:dog-assets}
app.assets.daily-requests=${ASSET_DAILY_REQUEST_LIMIT:10}
app.assets.harness-python=${ASSET_HARNESS_PYTHON:python3}

# Same-origin API exploration. Bearer tokens are kept only for this page session.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.api-docs.version=OPENAPI_3_0
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.paths-to-match=/v1/**
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.validator-url=
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.override-with-generic-response=false
