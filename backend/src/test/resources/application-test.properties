# H2 is test-only. CI overrides these with its disposable PostgreSQL service.
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:shelter_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
# PostgreSQL DDL is checked by the separate integrationTest task, never emulated in H2.
spring.flyway.enabled=false
