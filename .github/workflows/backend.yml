name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'render.yaml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'render.yaml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shelter_test
          POSTGRES_USER: shelter_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelter_ci -d shelter_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/shelter_test
      TEST_DB_USERNAME: shelter_ci
      TEST_DB_PASSWORD: disposable-ci-only
      TEST_DB_DRIVER: org.postgresql.Driver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: Install local motion renderer
        run: |
          python3 -m venv /tmp/shelter-motion-venv
          /tmp/shelter-motion-venv/bin/pip install -r motion-requirements.txt
          echo "ASSET_HARNESS_PYTHON=/tmp/shelter-motion-venv/bin/python" >> "$GITHUB_ENV"
      - name: Check local launchers and live verifier offline
        run: /tmp/shelter-motion-venv/bin/python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test motion renderer
        run: /tmp/shelter-motion-venv/bin/python -m unittest discover -s motion-tests -p 'test_*.py'
      - name: Test and build against PostgreSQL
        run: ./gradlew --no-daemon clean build integrationTest
      - name: Check sample loading and package separation
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/shelter_test
          DB_USERNAME: shelter_ci
          DB_PASSWORD: disposable-ci-only
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          ./gradlew --no-daemon loadSampleData
          ./gradlew --no-daemon loadSampleData
          counts=$(docker exec "$POSTGRES_CONTAINER" psql -U shelter_ci -d shelter_test -Atc \
            'SELECT (SELECT count(*) FROM shelter.shelters), (SELECT count(*) FROM shelter.dogs), (SELECT count(*) FROM shelter.dog_observations)')
          test "$counts" = '2|5|25'
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/libs/shelter-connect-api.jar') as jar:
              assert not any('/sample/' in name or name.endswith('dataset.json') for name in jar.namelist())
          PY
      - name: Check packaged server
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/shelter_test
          DB_USERNAME: shelter_ci
          DB_PASSWORD: disposable-ci-only
          DB_MIGRATE: 'true'
          SUPABASE_URL: https://auth.example.invalid
        run: |
          java -jar build/libs/shelter-connect-api.jar > /tmp/shelter-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness > /tmp/shelter-health.json; then
              python3 -c 'import json; assert json.load(open("/tmp/shelter-health.json")) == {"status": "UP"}'
              python3 scripts/check_read_api.py
              python3 scripts/check_auth_api.py
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat /tmp/shelter-api.log
          exit 1
      - name: Build deployment image
        run: docker build --tag shelter-connect-api:ci .
      - name: Check deployment image at 512 MB
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/shelter_test
          DB_USERNAME: shelter_ci
          DB_PASSWORD: disposable-ci-only
          SUPABASE_URL: https://auth.example.invalid
        run: |
          container=$(docker run -d --memory=512m --memory-swap=512m --cpus=1 \
            --network=host --env PORT=18080 --env DB_URL --env DB_USERNAME \
            --env DB_PASSWORD --env SUPABASE_URL --env DB_POOL_SIZE=3 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop=ALL --security-opt=no-new-privileges shelter-connect-api:ci)
          trap 'docker rm -f "$container" > /dev/null' EXIT
          test "$(docker exec "$container" id -u)" = 10001
          docker exec -i "$container" /opt/motion/bin/python < scripts/check_packaged_motion.py
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/actuator/health/readiness > /tmp/shelter-container-health.json; then
              python3 -c 'import json; assert json.load(open("/tmp/shelter-container-health.json")) == {"status": "UP"}'
              API_BASE_URL=http://127.0.0.1:18080 python3 scripts/check_read_api.py
              API_BASE_URL=http://127.0.0.1:18080 python3 scripts/check_auth_api.py
              test "$(docker inspect --format '{{.State.OOMKilled}}' "$container")" = false
              docker stats --no-stream --format '{{.MemUsage}}' "$container"
              exit 0
            fi
            if test "$(docker inspect --format '{{.State.Running}}' "$container")" != true; then
              break
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1
